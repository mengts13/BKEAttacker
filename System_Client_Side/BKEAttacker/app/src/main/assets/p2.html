<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Identity Selection & Pairing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #ffffff;
            color: #334155;
            line-height: 1.6;
            padding: 16px;
            min-height: 100vh;
        }
        /* Top Navigation */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px 0 12px;
            margin-bottom: 16px;
        }
        .page-title {
            font-size: 1.38rem;
            font-weight: 700;
            color: #1a3f7a;
            display: flex;
            align-items: center;
        }
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .avatar-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a3f7a, #0d2a57);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border: none;
            box-shadow: 0 3px 8px rgba(26, 63, 122, 0.25);
            cursor: pointer;
        }
        .latency-indicator {
            margin-top: 4px;
            font-size: 0.7rem;
            color: #38a169;
            font-weight: 500;
        }
        /* Step Indicator */
        .steps-container {
            display: flex;
            justify-content: space-between;
            padding: 0;
            margin: 10px 0 22px;
            position: relative;
        }
        .progress-bar {
            position: absolute;
            top: 13px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #d1dae6;
            z-index: 1;
        }
        .progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 33.3%;
            background-color: #1a3f7a;
            transition: all 0.3s ease;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            flex: 1;
        }
        .step-indicator {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 6px;
            border: 2px solid #d1dae6;
            background-color: #fff;
            color: #64748b;
        }
        .step.active .step-indicator {
            background-color: #1a3f7a;
            color: white;
            border-color: #1a3f7a;
        }
        .step-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: #64748b;
            text-align: center;
            line-height: 1.2;
        }
        .step.active .step-label {
            color: #1a3f7a;
            font-weight: 600;
        }
        /* Identity Selection Area */
        .identity-container {
            margin-bottom: 18px;
        }
        .identity-header {
            font-size: 1.08rem;
            color: #334155;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .identity-card {
            background: #fff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 5px 15px rgba(26, 63, 122, 0.1);
        }
        .identity-options {
            display: flex;
            gap: 12px;
        }
        .identity-option {
            flex: 1;
            border: 2px solid #d1dae6;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 76px;
        }
        .identity-option.selected {
            background: linear-gradient(135deg, #1a3f7a, #0d2a57);
            border-color: #1a3f7a;
            box-shadow: 0 4px 12px rgba(26, 63, 122, 0.2);
        }
        .identity-option.selected .option-title {
            color: white;
        }
        .identity-option.selected .option-desc {
            color: rgba(255, 255, 255, 0.85);
        }
        .identity-option:not(.selected) .option-title {
            color: #1a3f7a;
        }
        .identity-option:not(.selected) .option-desc {
            color: #64748b;
        }
        .option-title {
            font-size: 0.98rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .option-desc {
            font-size: 0.72rem;
            line-height: 1.4;
        }
        /* QR Code Area */
        .qrcode-container {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qrcode-header {
            font-size: 1.08rem;
            color: #334155;
            font-weight: 600;
            margin-bottom: 10px;
            align-self: flex-start;
        }
        .qrcode-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(26, 63, 122, 0.1);
            /* Initially not clickable */
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.3s ease, pointer-events 0.3s;
        }
        .qrcode-card.enabled {
            pointer-events: auto;
            opacity: 1;
        }
        .qrcode-placeholder {
            width: 180px;
            height: 180px;
            background-color: #f8fafc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed #d1dae6;
            margin-bottom: 14px;
        }
        .qrcode-icon {
            font-size: 2.4rem;
            color: #cbd5e1;
        }
        .scan-hint {
            font-size: 0.78rem;
            color: #64748b;
            text-align: center;
            max-width: 95%;
        }
        /* Button Container */
        .action-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 15px;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-icon {
            margin-right: 10px;
            font-size: 1.1rem;
        }
        .scan-btn {
            background: linear-gradient(135deg, #1a3f7a, #0d2a57);
            box-shadow: 0 5px 10px rgba(26, 63, 122, 0.25);
        }
        .pin-btn {
            background: white;
            border: 2px solid #1a3f7a;
            color: #1a3f7a;
            box-shadow: 0 4px 8px rgba(26, 63, 122, 0.15);
        }
        .action-btn:active:not(:disabled) {
            transform: translateY(2px);
        }
        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: ripple 0.6s linear;
        }
        .pin-btn .ripple {
            background-color: rgba(26, 63, 122, 0.15);
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        /* Responsive */
        @media (max-width: 400px) {
            .identity-option {
                min-height: 70px;
                padding: 10px 6px;
            }
            .page-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
<!-- Page Header -->
<div class="page-header">
    <div class="page-title">
        <i class="fas fa-users-cog" style="margin-right: 10px;"></i>
        Identity Selection & Pairing
    </div>
    <div class="avatar-container">
        <button class="avatar-btn" id="userAvatar">
            <i class="fas fa-user"></i>
        </button>
        <div class="latency-indicator">Latency: --ms</div>
    </div>
</div>

<!-- Step Indicator -->
<div class="steps-container">
    <div class="progress-bar">
        <div class="progress"></div>
    </div>
    <div class="step active">
        <div class="step-indicator">1</div>
        <div class="step-label">Selecting Identity</div>
    </div>
    <div class="step">
        <div class="step-indicator">2</div>
        <div class="step-label">Waiting for Pairing</div>
    </div>
    <div class="step">
        <div class="step-indicator">3</div>
        <div class="step-label">Pairing in Progress</div>
    </div>
</div>

<!-- Identity Selection -->
<div class="identity-container">
    <div class="identity-header">Select Identity Type</div>
    <div class="identity-card">
        <div class="identity-options">
            <div class="identity-option" id="option-vehicle">
                <div class="option-title">Impersonate Vehicle</div>
                <div class="option-desc">Approach the victim person</div>
            </div>
            <div class="identity-option" id="option-user">
                <div class="option-title">Impersonate Owner</div>
                <div class="option-desc">Approach the victim vehicle</div>
            </div>
        </div>
    </div>
</div>

<!-- QR Code -->
<div class="qrcode-container">
    <div class="qrcode-header">Pairing QR Code</div>
    <div class="qrcode-card" id="qrcodeCard">
        <div class="qrcode-placeholder">
            <i class="fas fa-qrcode qrcode-icon"></i>
        </div>
        <div class="scan-hint">Scan this QR code with the other device to complete pairing</div>
    </div>
</div>

<!-- Action Buttons -->
<div class="action-container">
    <button class="action-btn scan-btn" id="btnScan" disabled>
        <i class="fas fa-camera btn-icon"></i>
        Scan to Pair
    </button>
    <button class="action-btn pin-btn" id="btnPin" disabled>
        <i class="fas fa-key btn-icon"></i>
        Pair with PIN
    </button>
</div>

<script>
    // Step management
    const steps = document.querySelectorAll('.step');
    const progress = document.querySelector('.progress');
    function setStep(n){
        if(!steps || steps.length < 3) return;
        steps[0].classList.toggle('active', n >= 1);
        steps[1].classList.toggle('active', n >= 2);
        steps[2].classList.toggle('active', n >= 3);
        if(progress){ progress.style.width = (n * 33.3) + '%'; }
    }

    function getCounterpartRole(){
        const myRole = (localStorage.getItem('dup.role') || 'U').toUpperCase();
        return myRole;
    }

    function refreshQRCodeDisplay() {
        const qrcodePlaceholder = document.querySelector('.qrcode-placeholder');
        if (!qrcodePlaceholder) return;

        if (qrcodePlaceholder.__loading) return;
        qrcodePlaceholder.__loading = true;

        qrcodePlaceholder.innerHTML = '<div style="font-size:0.8rem;color:#94a3b8;">Loading...</div>';

        setTimeout(() => {
            let qrcodeB64 = null;
            try {
                if (window.DupClient && typeof window.DupClient.refreshQRCode === 'function') {
                    qrcodeB64 = window.DupClient.refreshQRCode();
                }
            } catch (e) {
                console.error('[QR] refreshQRCode failed:', e);
            }

            if (qrcodeB64 && typeof qrcodeB64 === 'string' && qrcodeB64.trim() !== '') {
                const img = document.createElement('img');
                img.src = 'data:image/png;base64,' + qrcodeB64;
                img.alt = 'Pairing QR Code';
                img.style.width = '100%';
                img.style.maxWidth = '180px';
                img.style.height = 'auto';
                img.style.borderRadius = '10px';
                img.style.objectFit = 'contain';
                qrcodePlaceholder.innerHTML = '';
                qrcodePlaceholder.appendChild(img);
            } else {
                qrcodePlaceholder.innerHTML = '<i class="fas fa-qrcode qrcode-icon"></i>';
                console.warn('[QR] Failed to load QR code');
            }

            qrcodePlaceholder.__loading = false;
        }, 100);
    }

    // Enable/disable pairing UI
    function enablePairingUI() {
        const scanBtn = document.getElementById('btnScan');
        const pinBtn = document.getElementById('btnPin');
        const qrcodeCard = document.getElementById('qrcodeCard');
        if (scanBtn) scanBtn.disabled = false;
        if (pinBtn) pinBtn.disabled = false;
        if (qrcodeCard) qrcodeCard.classList.add('enabled');
    }

    function disablePairingUI() {
        const scanBtn = document.getElementById('btnScan');
        const pinBtn = document.getElementById('btnPin');
        const qrcodeCard = document.getElementById('qrcodeCard');
        if (scanBtn) scanBtn.disabled = true;
        if (pinBtn) pinBtn.disabled = true;
        if (qrcodeCard) qrcodeCard.classList.remove('enabled');
    }

    setStep(1);
    try {
        if (window.DupClient && typeof window.DupClient.readPin === 'function') {
            window.DupClient.readPin();
        }
    } catch(e) {
        console.warn('[p2] auto readPin on load failed:', e);
    }

    // Initially disable pairing functionality
    disablePairingUI();

    // Click QR code area: only refresh QR code (only allowed after identity is selected)
    document.getElementById('qrcodeCard').addEventListener('click', function(e) {
        if (!this.classList.contains('enabled')) return;
        if (e.target.closest('.action-btn')) return;

        // Refresh QR code
        refreshQRCodeDisplay();
    });

    const vehicleOption = document.getElementById('option-vehicle');
    const userOption = document.getElementById('option-user');
    if (vehicleOption) vehicleOption.classList.remove('selected');
    if (userOption) userOption.classList.remove('selected');

    function tokenReady(){
        try {
            if (window.DupClient && typeof window.DupClient.hasAuthToken === 'function') {
                return !!window.DupClient.hasAuthToken();
            }
        } catch(e) { console.warn('[p2] hasAuthToken exception:', e); }
        return false;
    }

    function registerSelfOnce(role){
        if (!tokenReady()) {
            console.log('[p2] token not ready yet, wait 800ms...');
            return -4;
        }
        if (!(window.DupClient && typeof window.DupClient.registerSelf === 'function')) {
            console.warn('[p2] DupClient.registerSelf not available');
            return -99;
        }
        try {
            const rc = window.DupClient.registerSelf(role);
            console.log('[p2] registerSelf(' + role + ') rc=', rc);
            return rc;
        } catch(e){ console.error('[p2] registerSelf exception:', e); return -98; }
    }

    function registerSelfWithRetry(role, attempts = 5, delayMs = 1000, onDone){
        let tryCount = 0;
        const tick = () => {
            const rc = registerSelfOnce(role);
            if (rc === 0) {
                localStorage.setItem('dup.role', role);
                onDone && onDone(0);
            } else if (rc === -4 && tryCount < attempts - 1) {
                tryCount++;
                console.log('[p2] registerSelf retry #' + tryCount + ' in ' + delayMs + 'ms');
                setTimeout(tick, delayMs);
            } else {
                onDone && onDone(rc);
            }
        };
        tick();
    }

    function afterRoleSelectedAndRegistered() {
        try {
            if (window.DupClient && typeof window.DupClient.readPin === 'function') {
                const pin = window.DupClient.readPin() || '';
                console.log('[p2] readPin(after role, first time) ->', pin);
                if (pin && pin.length === 6) {
                    localStorage.setItem('dup.last_pin', pin);
                    if (typeof window.DupClient.sendPin === 'function') {
                        const rcPin = window.DupClient.sendPin(pin);
                        console.log('[p2] sendPin(after role) rc=', rcPin);
                        if (rcPin === 0) localStorage.setItem('dup.pin_sent', '1');
                    }
                }
            }
        } catch(e){ console.error('[p2] sendPin after role exception:', e); }
    }

    // Fake Vehicle
    vehicleOption.addEventListener('click', function() {
        if (vehicleOption.__busy) return;
        vehicleOption.__busy = true;
        vehicleOption.classList.add('selected');
        userOption.classList.remove('selected');
        registerSelfWithRetry('V', 5, 1000, function(rc){
            vehicleOption.__busy = false;
            if (rc === 0) {
                setStep(2);
                afterRoleSelectedAndRegistered();
                enablePairingUI(); // ✅ Enable pairing functionality
            } else {
                alert('Failed to register identity, error code: ' + rc);
            }
        });
        refreshQRCodeDisplay();
    });

    // Fake User
    userOption.addEventListener('click', function() {
        if (userOption.__busy) return;
        userOption.__busy = true;
        userOption.classList.add('selected');
        vehicleOption.classList.remove('selected');
        registerSelfWithRetry('U', 5, 1000, function(rc){
            userOption.__busy = false;
            if (rc === 0) {
                setStep(2);
                afterRoleSelectedAndRegistered();
                enablePairingUI(); // ✅ Enable pairing functionality
            } else {
                alert('Failed to register identity, error code: ' + rc);
            }
        });
        refreshQRCodeDisplay();
    });

    // Ripple Effect
    function createRipple(e) {
        const btn = this;
        if (btn.disabled) return; // No ripple when disabled
        const rect = btn.getBoundingClientRect();
        const circle = document.createElement('span');
        const diameter = Math.max(btn.clientWidth, btn.clientHeight);
        const radius = diameter / 2;
        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - rect.left - radius}px`;
        circle.style.top = `${e.clientY - rect.top - radius}px`;
        circle.classList.add('ripple');
        const ripple = btn.getElementsByClassName('ripple')[0];
        if (ripple) ripple.remove();
        btn.appendChild(circle);
    }
    document.querySelectorAll('.action-btn').forEach(btn => btn.addEventListener('click', createRipple));

    // PIN button logic
    const pinBtn = document.getElementById('btnPin');
    if (pinBtn && !pinBtn.__bound) {
        pinBtn.__bound = true;
        pinBtn.addEventListener('click', function(){
            if (pinBtn.__busy) return;
            pinBtn.__busy = true;
            try {
                const role = localStorage.getItem('dup.role');
                if (!role) { alert('Please select an identity and register successfully first'); pinBtn.__busy = false; return; }
                const pin = localStorage.getItem('dup.last_pin') || '';
                if (!pin || pin.length !== 6) { alert('PIN not obtained, please select an identity first or try again later'); pinBtn.__busy = false; return; }
                const sent = localStorage.getItem('dup.pin_sent') === '1';
                if (!sent && window.DupClient && typeof window.DupClient.sendPin === 'function') {
                    const rc = window.DupClient.sendPin(pin);
                    console.log('[p2] sendPin (resend) rc=', rc);
                    if (rc === 0) localStorage.setItem('dup.pin_sent', '1');
                }
                alert('Local PIN: ' + pin + ', please enter it on the other device to pair');
                location.href = 'p8.html';
            } catch (e) { console.error('[p2] PIN flow exception:', e); }
            finally { /* Stay busy until navigation is complete */ }
        });
    }

    // Scan button logic
    const scanBtn = document.getElementById('btnScan');
    if (scanBtn) {
        scanBtn.addEventListener('click', function(){
            if (window.Android && typeof window.Android.launchScanner === 'function') {
                window.Android.launchScanner(getCounterpartRole());
            } else {
                alert('Scan function is not available, please try again later');
                console.error('Android.launchScanner is not available');
            }
        });
    }

    // User avatar click navigation
    document.getElementById('userAvatar').addEventListener('click', function() {
        location.href = 'p7.html';
    });
</script>
</body>
</html>
